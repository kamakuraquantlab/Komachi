[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "komachi"
version = "0.1.0"
description = "Kamakura Quant Lab command line client for historical market data"
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# Everything needed to query and inspect what was downloaded.
duckdb = [
    "duckdb>=1.0.0",
    "pyarrow>=15.0",
    "pandas",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "duckdb>=1.0.0",
    "pyarrow>=15.0",
    "pandas",
]

[project.scripts]
# `komachi.cli`, not a bare `cli`: a top-level module outside the package is
# not installed by `packages.find`, so the command imported whichever `cli`
# some other distribution happened to ship.
komachi = "komachi.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["komachi*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
