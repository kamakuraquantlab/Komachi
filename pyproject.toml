[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kamakuraquantlab-komachi"
version = "0.4.3"
description = "Kamakura Quant Lab command line client for historical market data"
readme = "README.md"
requires-python = ">=3.13"

license = "Apache-2.0"
license-files = ["LICENSE.md"]
authors = [{name = "Kamakura Quant Lab", email = "support@kamakuraquantlab.jp"}]
keywords = ["cryptocurrency", "market-data", "order-book", "japan", "quantitative-finance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# Everything needed to query and inspect what was downloaded.
duckdb = [
    "duckdb>=1.0.0",
    "pyarrow>=15.0",
    "pandas",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "duckdb>=1.0.0",
    "pyarrow>=15.0",
    "pandas",
]

[project.urls]
Homepage = "https://kamakuraquantlab.jp"
Documentation = "https://kamakuraquantlab.jp/support/"
Source = "https://github.com/kamakuraquantlab/Komachi"
"The data" = "https://kamakuraquantlab.jp/data/"

[project.scripts]
# `komachi.cli`, not a bare `cli`: a top-level module outside the package is
# not installed by `packages.find`, so the command imported whichever `cli`
# some other distribution happened to ship.
komachi = "komachi.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["komachi*"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
